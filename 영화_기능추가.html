<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 영화 티어리스트</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .controls input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 1rem;
    }

    .controls button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .controls button:hover {
      opacity: 0.85;
    }

    .btn-add {
      background-color: #4CAF50;
      color: white;
    }

    .btn-reset {
      background-color: #f44336;
      color: white;
    }

    .tier-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }

    .tier-row {
      display: flex;
      background-color: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      min-height: 80px;
      border: 1px solid #2a2a2a;
    }

    .tier-label {
      width: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      color: #121212;
      flex-shrink: 0;
    }

    .tier-count {
      font-size: 0.85rem;
      font-weight: normal;
      margin-top: 4px;
      opacity: 0.85;
    }

    .tier-s { background-color: #ff7f7f; }
    .tier-a { background-color: #ffbf7f; }
    .tier-b { background-color: #ffff7f; }
    .tier-c { background-color: #7fff7f; }

    .tier-dropzone {
      flex: 1;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
      min-height: 80px;
    }

    .unranked-section {
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 15px;
      border: 1px solid #2a2a2a;
    }

    .unranked-header {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .movie-card {
      background-color: #2c2c2c;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: grab;
      user-select: none;
      word-break: break-all;
    }

    .movie-card:active {
      cursor: grabbing;
    }

    .movie-card.dragging {
      opacity: 0.4;
    }

    .tier-buttons {
      display: flex;
      gap: 4px;
      margin-left: 4px;
    }

    .tier-btn {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .tier-btn:hover {
      background-color: #555;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      
      .tier-label {
        width: 70px;
        font-size: 1rem;
      }

      .controls {
        flex-direction: column;
      }

      .controls input[type="text"] {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>내 영화 티어리스트</h1>

  <div class="controls">
    <input type="text" id="movie-title-input" placeholder="영화 제목을 입력하세요..." onkeydown="if(event.key === 'Enter') addMovie()">
    <button class="btn-add" onclick="addMovie()">추가</button>
    <button class="btn-reset" onclick="resetToDefault()">처음으로</button>
  </div>

  <div class="tier-container">
    <div class="tier-row">
      <div class="tier-label tier-s">
        <span>S</span>
        <span class="tier-count" id="count-S">(0)</span>
      </div>
      <div class="tier-dropzone" data-tier="S" ondragover="handleDragOver(event)" ondrop="handleDrop(event)"></div>
    </div>

    <div class="tier-row">
      <div class="tier-label tier-a">
        <span>A</span>
        <span class="tier-count" id="count-A">(0)</span>
      </div>
      <div class="tier-dropzone" data-tier="A" ondragover="handleDragOver(event)" ondrop="handleDrop(event)"></div>
    </div>

    <div class="tier-row">
      <div class="tier-label tier-b">
        <span>B</span>
        <span class="tier-count" id="count-B">(0)</span>
      </div>
      <div class="tier-dropzone" data-tier="B" ondragover="handleDragOver(event)" ondrop="handleDrop(event)"></div>
    </div>

    <div class="tier-row">
      <div class="tier-label tier-c">
        <span>C</span>
        <span class="tier-count" id="count-C">(0)</span>
      </div>
      <div class="tier-dropzone" data-tier="C" ondragover="handleDragOver(event)" ondrop="handleDrop(event)"></div>
    </div>
  </div>

  <div class="unranked-section">
    <div class="unranked-header">
      <span>아직 안 정한 영화</span>
      <span id="count-unranked" style="font-size: 0.9rem; font-weight: normal; opacity: 0.8;">(0)</span>
    </div>
    <div class="tier-dropzone" data-tier="unranked" ondragover="handleDragOver(event)" ondrop="handleDrop(event)"></div>
  </div>

  <script>
    const INITIAL_MOVIES = [
      '기생충', '인터스텔라', '라라랜드', '센과 치히로의 행방불명',
      '어벤져스: 엔드게임', '범죄도시', '타이타닉', '토이 스토리'
    ];

    let moviesState = [];
    let draggedItemIndex = null;

    function init() {
      const saved = localStorage.getItem('movie_tier_list');
      if (saved) {
        try {
          moviesState = JSON.parse(saved);
        } catch (e) {
          loadDefaultState();
        }
      } else {
        loadDefaultState();
      }
      render();
    }

    function loadDefaultState() {
      moviesState = INITIAL_MOVIES.map(title => ({
        title: title,
        tier: 'unranked'
      }));
      saveState();
    }

    function saveState() {
      localStorage.setItem('movie_tier_list', JSON.stringify(moviesState));
    }

    function updateCounts() {
      const counts = { S: 0, A: 0, B: 0, C: 0, unranked: 0 };
      moviesState.forEach(m => {
        if (counts[m.tier] !== undefined) {
          counts[m.tier]++;
        } else {
          counts.unranked++;
        }
      });

      document.getElementById('count-S').textContent = `(${counts.S})`;
      document.getElementById('count-A').textContent = `(${counts.A})`;
      document.getElementById('count-B').textContent = `(${counts.B})`;
      document.getElementById('count-C').textContent = `(${counts.C})`;
      document.getElementById('count-unranked').textContent = `(${counts.unranked})`;
    }

    function render() {
      const dropzones = document.querySelectorAll('.tier-dropzone');
      dropzones.forEach(zone => zone.innerHTML = '');

      moviesState.forEach((movie, index) => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.draggable = true;

        card.addEventListener('dragstart', (e) => {
          draggedItemIndex = index;
          card.classList.add('dragging');
          e.dataTransfer.setData('text/plain', index);
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          draggedItemIndex = null;
        });

        const titleText = document.createElement('span');
        titleText.textContent = movie.title;
        card.appendChild(titleText);

        const btnGroup = document.createElement('div');
        btnGroup.className = 'tier-buttons';

        const tiers = ['S', 'A', 'B', 'C'];
        tiers.forEach(t => {
          if (movie.tier !== t) {
            const btn = document.createElement('button');
            btn.className = 'tier-btn';
            btn.textContent = t;
            btn.onclick = (e) => {
              e.stopPropagation();
              moveMovie(index, t);
            };
            btnGroup.appendChild(btn);
          }
        });

        if (movie.tier !== 'unranked') {
          const btn = document.createElement('button');
          btn.className = 'tier-btn';
          btn.textContent = '해제';
          btn.onclick = (e) => {
            e.stopPropagation();
            moveMovie(index, 'unranked');
          };
          btnGroup.appendChild(btn);
        }

        card.appendChild(btnGroup);

        const targetZone = document.querySelector(`.tier-dropzone[data-tier="${movie.tier}"]`);
        if (targetZone) {
          targetZone.appendChild(card);
        }
      });

      updateCounts();
    }

    function moveMovie(index, targetTier) {
      if (moviesState[index]) {
        moviesState[index].tier = targetTier;
        saveState();
        render();
      }
    }

    function addMovie() {
      const input = document.getElementById('movie-title-input');
      const title = input.value.trim();
      
      if (!title) return;

      moviesState.push({
        title: title,
        tier: 'unranked'
      });
      
      input.value = '';
      saveState();
      render();
    }

    function resetToDefault() {
      loadDefaultState();
      render();
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDrop(e) {
      e.preventDefault();
      const targetZone = e.currentTarget;
      const targetTier = targetZone.getAttribute('data-tier');
      
      if (draggedItemIndex !== null && targetTier) {
        moveMovie(draggedItemIndex, targetTier);
      }
    }

    window.onload = init;
  </script>
</body>
</html>

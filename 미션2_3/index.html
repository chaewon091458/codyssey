<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자녀 결혼 맘빠 모임 정보 공유방</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background-color: #fdf6f6; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { color: #d63384; text-align: center; margin-bottom: 10px; }
        .intro { text-align: center; color: #666; margin-bottom: 30px; }
        .card { border: 1px solid #f1d3d3; padding: 20px; margin-bottom: 20px; border-radius: 8px; background: #fff9f9; }
        .card h3 { margin-top: 0; color: #b02a37; }
        .btn { display: inline-block; padding: 8px 16px; background: #d63384; color: white; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .btn:hover { background: #b02a37; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>자녀 결혼 맘빠 모임 정보 공유방</h1>
        <p class="intro">자녀의 행복한 결혼 준비를 함께 고민하고 알짜 정보를 나누는 부모님들의 공간입니다.</p>
        
        <div class="card">
            <h3>상견례 장소 추천 리스트</h3>
            <p>조용하고 분위기 좋은 상견례 전문 한식당 및 코스요리 장소 정보를 모았습니다.</p>
            <a href="https://www.naver.com" target="_blank" class="btn">정보 보기</a>
        </div>

        <div class="card">
            <h3>인기 웨딩홀 & 예식장 예약 팁</h3>
            <p>지역별 선호도 높은 예식장 비교와 상담 예약 시 꼭 체크해야 할 사항 안내.</p>
            <a href="https://www.google.com" target="_blank" class="btn">정보 보기</a>
        </div>

        <div class="card">
            <h3>혼수 및 예단·예물 체크리스트 (사용자 피드백 반영)</h3>
            <p>준비 과정에서 빠뜨리기 쉬운 품목과 예산 편성 요령을 체크리스트로 확인하세요.</p>
            <a href="https://github.com" target="_blank" class="btn">정보 보기</a>
        </div>
    </div>
</body>
</html>

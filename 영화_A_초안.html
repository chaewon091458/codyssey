<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영화 티어리스트 (Movie Tier List)</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --text-sub: #aaaaaa;
      --border-color: #333333;
      
      /* Tier Colors */
      --s-tier: #ff7f7f;
      --a-tier: #ffbf7f;
      --b-tier: #ffff7f;
      --c-tier: #7fff7f;
      --d-tier: #7fbfff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2rem;
      text-align: center;
    }

    /* 입력 영역 */
    .input-container {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 25px;
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .input-container input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background-color: #2a2a2a;
      color: #fff;
      font-size: 1rem;
    }

    .input-container input:focus {
      outline: none;
      border-color: #ff7f7f;
    }

    .input-container button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      background-color: #e50914;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .input-container button:hover {
      background-color: #b80710;
    }

    /* 티어 보드 */
    .tier-board {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      background-color: #000;
      padding: 5px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .tier-row {
      display: flex;
      min-height: 100px;
      background-color: #1a1a1a;
      border-radius: 4px;
      overflow: hidden;
    }

    .tier-label {
      width: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      font-weight: bold;
      color: #111;
      flex-shrink: 0;
      user-select: none;
    }

    /* Tier Backgrounds */
    .tier-s { background-color: var(--s-tier); }
    .tier-a { background-color: var(--a-tier); }
    .tier-b { background-color: var(--b-tier); }
    .tier-c { background-color: var(--c-tier); }
    .tier-d { background-color: var(--d-tier); }

    .tier-dropzone {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
      align-items: center;
      min-height: 100px;
    }

    /* 미분류 영화 보관함 */
    .unranked-section {
      width: 100%;
      max-width: 900px;
      margin-top: 25px;
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .unranked-section h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--text-sub);
    }

    .unranked-dropzone {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 100px;
      padding: 10px;
      background-color: #121212;
      border-radius: 4px;
      border: 2px dashed var(--border-color);
    }

    /* 영화 카드 디자인 */
    .movie-card {
      width: 120px;
      height: 80px;
      background-color: #2a2a2a;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px;
      cursor: grab;
      user-select: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      position: relative;
      border: 1px solid #3d3d3d;
      transition: transform 0.1s;
    }

    .movie-card:active {
      cursor: grabbing;
    }

    .movie-card.dragging {
      opacity: 0.4;
    }

    .movie-title {
      font-size: 0.85rem;
      font-weight: 600;
      word-break: break-word;
      line-height: 1.2;
      color: #fff;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff4d4d;
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .delete-btn:hover {
      opacity: 1;
    }

    /* 드래그 상태 스타일 */
    .dropzone-active {
      background-color: #2c2c2c;
    }
  </style>
</head>
<body>

  <h1>🎬 영화 티어리스트</h1>

  <!-- 입력 창 -->
  <div class="input-container">
    <input type="text" id="movie-input" placeholder="영화 제목을 입력하세요..." onkeydown="if(event.key === 'Enter') addMovie()">
    <button onclick="addMovie()">추가</button>
  </div>

  <!-- 티어 보드 -->
  <div class="tier-board">
    <div class="tier-row">
      <div class="tier-label tier-s">S</div>
      <div class="tier-dropzone" data-tier="S"></div>
    </div>
    <div class="tier-row">
      <div class="tier-label tier-a">A</div>
      <div class="tier-dropzone" data-tier="A"></div>
    </div>
    <div class="tier-row">
      <div class="tier-label tier-b">B</div>
      <div class="tier-dropzone" data-tier="B"></div>
    </div>
    <div class="tier-row">
      <div class="tier-label tier-c">C</div>
      <div class="tier-dropzone" data-tier="C"></div>
    </div>
    <div class="tier-row">
      <div class="tier-label tier-d">D</div>
      <div class="tier-dropzone" data-tier="D"></div>
    </div>
  </div>

  <!-- 미분류 영역 -->
  <div class="unranked-section">
    <h2>대기 목록 (드래그하여 티어에 배치하세요)</h2>
    <div class="tier-dropzone unranked-dropzone" id="unranked-zone" data-tier="unranked"></div>
  </div>

  <script>
    let draggedItem = null;

    // 초기 샘플 영화 데이터
    const sampleMovies = ["인셉션", "파이트 클럽", "다크 나이트", "기생충", "인터스텔라"];

    document.addEventListener("DOMContentLoaded", () => {
      const unrankedZone = document.getElementById("unranked-zone");
      sampleMovies.forEach(title => {
        unrankedZone.appendChild(createMovieCard(title));
      });
      setupDropzones();
    });

    // 영화 카드 생성 함수
    function createMovieCard(title) {
      const card = document.createElement("div");
      card.className = "movie-card";
      card.draggable = true;
      card.id = "card-" + Date.now() + "-" + Math.random().toString(36).substr(2, 4);

      const titleEl = document.createElement("div");
      titleEl.className = "movie-title";
      titleEl.innerText = title;

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "delete-btn";
      deleteBtn.innerText = "삭제";
      deleteBtn.onclick = (e) => {
        e.stopPropagation();
        card.remove();
      };

      actions.appendChild(deleteBtn);
      card.appendChild(titleEl);
      card.appendChild(actions);

      // 드래그 이벤트 리스너 등록
      card.addEventListener("dragstart", handleDragStart);
      card.addEventListener("dragend", handleDragEnd);

      return card;
    }

    // 영화 추가 함수
    function addMovie() {
      const input = document.getElementById("movie-input");
      const title = input.value.trim();
      if (!title) return;

      const unrankedZone = document.getElementById("unranked-zone");
      const card = createMovieCard(title);
      unrankedZone.appendChild(card);

      input.value = "";
    }

    // Drag & Drop 이벤트 핸들러
    function handleDragStart(e) {
      draggedItem = this;
      setTimeout(() => this.classList.add("dragging"), 0);
    }

    function handleDragEnd(e) {
      this.classList.remove("dragging");
      draggedItem = null;
    }

    function setupDropzones() {
      const dropzones = document.querySelectorAll(".tier-dropzone");

      dropzones.forEach(zone => {
        zone.addEventListener("dragover", (e) => {
          e.preventDefault();
          zone.classList.add("dropzone-active");
        });

        zone.addEventListener("dragleave", (e) => {
          zone.classList.remove("dropzone-active");
        });

        zone.addEventListener("drop", (e) => {
          e.preventDefault();
          zone.classList.remove("dropzone-active");
          if (draggedItem) {
            zone.appendChild(draggedItem);
          }
        });
      });
    }
  </script>
</body>
</html>
